name: Update Dynamic Experience

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-experience.yml'

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Calculate Experience and Update README
        run: |
          python -c "
          from datetime import datetime, timezone
          import re

          now = datetime.now(timezone.utc)
          y = now.year - 2026
          m = now.month - 3
          if now.day < 27:
              m -= 1
          if m < 0:
              y -= 1
              m += 12
          if y < 0:
              y, m = 0, 0

          if y == 0:
              short = f'0.{m}'
          elif m == 0:
              short = f'{y}'
          else:
              short = f'{y}.{m}'

          print(f'Current dynamic experience from 2026-03-27: {short}+ Years (years={y}, months={m})')

          with open('README.md', 'r', encoding='utf-8') as f:
              content = f.read()

          content = re.sub(
              r'Associate\+Software\+Engineer\+\([0-9.]+%2B\+Yrs\+Exp\)',
              f'Associate+Software+Engineer+({short}%2B+Yrs+Exp)',
              content
          )
          content = re.sub(
              r'<b>Associate Software Engineer @ Test Yantra \([0-9.]+\+ Years Experience\)</b>',
              f'<b>Associate Software Engineer @ Test Yantra ({short}+ Years Experience)</b>',
              content
          )
          content = re.sub(
              r'Java Backend Developer\*\* with \*\*[0-9.]+\+ years of experience\*\*',
              f'Java Backend Developer** with **{short}+ years of experience**',
              content
          )
          content = re.sub(
              r'<summary><b>🏢 Associate Software Engineer — Test Yantra, Bangalore \([0-9.]+\+ Years Experience\)</b></summary>',
              f'<summary><b>🏢 Associate Software Engineer — Test Yantra, Bangalore ({short}+ Years Experience)</b></summary>',
              content
          )
          content = re.sub(
              r'Java Backend & Microservices Developer \([0-9.]+\+ Years Experience\)',
              f'Java Backend & Microservices Developer ({short}+ Years Experience)',
              content
          )

          with open('README.md', 'w', encoding='utf-8') as f:
              f.write(content)
          "

      - name: Commit and push changes if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "README.md is already up-to-date with current experience."
          else
            git commit -m "chore(profile): auto-update experience month-by-month"
            git push origin main
          fi
